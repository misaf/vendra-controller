openapi: 3.1.0
info: {title: Vendra Provisioner API, version: 1.0.0}
paths:
  /health:
    get:
      responses:
        "200": {description: Healthy}
  /v1/capabilities:
    get:
      security: [{bearerAuth: []}]
      responses:
        "200": {description: Supported API capabilities}
  /v1/storefronts:
    post:
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StorefrontRequest"}
      responses:
        "200":
          description: Storefront ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StorefrontResponse"}
        "401": {description: Unauthorized}
        "422": {description: Invalid request}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    StorefrontRequest:
      type: object
      additionalProperties: false
      required: [template, image, tenant_id, slug, domain, theme, configuration, configuration_base64]
      properties:
        template: {type: string}
        image: {type: string}
        tenant_id: {type: integer, format: int64}
        slug: {type: string}
        domain: {type: string}
        theme: {type: string}
        configuration: {type: object}
        configuration_base64: {type: string, contentEncoding: base64}
    StorefrontResponse:
      type: object
      required: [status, reference, image_digest]
      properties:
        status: {type: string, enum: [ready]}
        reference: {type: string}
        image_digest: {type: string}

